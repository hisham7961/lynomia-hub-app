# بوابة CI للتطبيق (§137 · المرحلة ٥.٤) — تنسيق/تحليل/اختبارات + بناء Android وiOS.
# لا اعتماد إنتاجي مطلوب للبوابة: كل الاختبارات على fakes ولقطات العقد الملتزمة.
# المدخلات الاختيارية (docs/OWNER_SETUP.md §٦) — غيابها لا يُسقط شيئاً، بل يتخطّى خطوة الإصدار:
#   secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#            ANDROID_KEY_PASSWORD, FIREBASE_DEFINES_JSON
#   vars:    LYNOMIA_ANDROID_APP_ID, LYNOMIA_APP_LINK_HOST, API_BASE_URL
name: app

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      - name: Dart format check
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Tests (unit + widget + contract + governance)
        run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: quality
    env:
      LYNOMIA_ANDROID_APP_ID: ${{ vars.LYNOMIA_ANDROID_APP_ID }}
      LYNOMIA_APP_LINK_HOST: ${{ vars.LYNOMIA_APP_LINK_HOST }}
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      - name: Build debug APK (smoke — بلا أي اعتماد)
        run: flutter build apk --debug

      # ── الإصدار الموقَّع: فقط حين تتوفر أسرار keystore ──
      - name: Restore release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Firebase defines (اختياري)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          FIREBASE_DEFINES_JSON: ${{ secrets.FIREBASE_DEFINES_JSON }}
        run: |
          if [ -n "$FIREBASE_DEFINES_JSON" ]; then
            printf '%s' "$FIREBASE_DEFINES_JSON" > firebase.defines.json
          else
            echo '{}' > firebase.defines.json
          fi
      - name: Build release App Bundle (موقَّع — يفشل إن غاب التوقيع)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          LYNOMIA_REQUIRE_RELEASE_SIGNING: 'true'
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=prod \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define-from-file=firebase.defines.json
      - name: Upload App Bundle
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks" firebase.defines.json

  ios:
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      # بلا توقيع: يتحقق من المشروع والاستحقاقات والأيقونات والإضافات (SwiftPM) — التوقيع
      # والرفع إلى App Store Connect يدويان أو بمسارٍ لاحق (OWNER_SETUP §٣).
      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign
