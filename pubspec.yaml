name: lynomia_hub_app
description: "Lynomia Hub — تطبيقُ الجوال الأصيل لمنصّة Lynomia Business Hub (iOS + Android)."
publish_to: 'none'

# النسخةُ تُدار عبر VERSION/README/CHANGELOG (راجع CLAUDE.md) — تطابقُها هنا إلزاميّ.
version: 0.5.0+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الملاحة التصريحية (§15)
  go_router: ^16.0.0
  # طبقة HTTP الرقيقة — عميل قابل للحقن والاختبار (§100)
  http: ^1.5.0
  # المخزن الآمن للرموز (iOS Keychain / Android Keystore) (§35)
  flutter_secure_storage: ^9.2.0
  # تشفير الخبيئة المحلية (AES-GCM بمفتاح في المخزن الآمن) (§63)
  cryptography: ^2.7.0
  # حالة الاتصال (§84)
  connectivity_plus: ^6.1.0
  # الماسح (QR/Barcode) (§70)
  mobile_scanner: ^7.0.0
  # الموقع — جلسة التتبع الصريحة فقط (§71)
  geolocator: ^14.0.0
  # فتح القفل بالبيومترية — جانب العميل فقط (§40)
  local_auth: ^2.3.0
  # مصادر الملفات (§68)
  image_picker: ^1.2.0
  file_picker: ^10.0.0
  # الروابط العميقة /m/* و /app/* (§76)
  app_links: ^6.4.0
  # إصدار التطبيق ورقم البناء لترويسات العقد (§30)
  package_info_plus: ^8.3.0
  # مسارات التخزين المحلي
  path_provider: ^2.1.0
  # تمثيل عشري آمن للمال — عرضٌ لا حساب (§81)
  decimal: ^3.0.0
  # معرّفات UUID (التنصيب/الطلب/الـIdempotency) (§29 §58)
  uuid: ^4.5.0
  # فتح روابط المتجر/الدعم والوجهات web-only (§46 §16)
  url_launcher: ^6.3.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
